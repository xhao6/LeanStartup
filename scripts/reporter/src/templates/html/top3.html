<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1440">
<style>
  @font-face { font-family:'Noto Serif SC'; src:url('{{fontSerif}}') format('woff2'); font-weight:700; }
  @font-face { font-family:'Noto Sans SC'; src:url('{{fontSans}}') format('woff2'); font-weight:400; }
  @font-face { font-family:'Noto Sans SC'; src:url('{{fontSans}}') format('woff2'); font-weight:600; }
  @font-face { font-family:'Roboto Mono'; src:url('{{fontMono}}') format('woff2'); font-weight:700; }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width:1080px; height:1440px;
    background:#F8F6F1;
    background-image:
      radial-gradient(ellipse 600px 300px at 20% 20%, rgba(225,29,72,0.03) 0%, transparent 100%),
      radial-gradient(ellipse 400px 400px at 80% 80%, rgba(202,138,4,0.03) 0%, transparent 100%);
    font-family:'Noto Sans SC',sans-serif; color:#1C1917;
    display:flex; flex-direction:column;
    position:relative; overflow:hidden;
  }

  /* ===== Background decorative elements ===== */
  body::before {
    content:'03'; position:absolute; right:24px; top:400px;
    font-family:'Noto Serif SC',serif; font-size:360px; font-weight:700;
    color:#EDE9E2; line-height:1; pointer-events:none;
    z-index:0; letter-spacing:-20px;
  }
  body::after {
    content:'MIND'; position:absolute; left:-20px; bottom:160px;
    font-family:'Roboto Mono',monospace; font-size:120px; font-weight:700;
    color:#EDE9E2; line-height:1; pointer-events:none;
    z-index:0; letter-spacing:8px; opacity:0.5;
  }
  .corner-accent {
    position:absolute; z-index:1;
    top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 80px 80px 0;
    border-color:transparent #E11D48 transparent transparent;
    opacity:0.08;
    pointer-events:none;
  }

  /* ===== Header ===== */
  .header {
    position:relative; z-index:1;
    padding:32px 56px 0;
    display:flex; justify-content:space-between; align-items:flex-start;
    flex-shrink:0;
  }
  .header-brand {
    font-family:'Noto Sans SC',sans-serif; font-size:18px; font-weight:600;
    color:#78716C; letter-spacing:2px;
  }
  .header-brand em {
    font-family:'Noto Serif SC',serif; font-style:normal; font-weight:700;
    color:#E11D48; font-size:20px;
  }
  .header-date {
    font-family:'Noto Sans SC',sans-serif; font-size:14px; font-weight:500;
    color:#A8A29E; letter-spacing:1px;
  }

  /* ===== Hero ===== */
  .hero {
    position:relative; z-index:1;
    flex-shrink:0; padding:20px 56px 0;
  }
  .hero-title {
    font-family:'Noto Serif SC',serif; font-size:92px; font-weight:700;
    color:#1C1917; line-height:1.06; letter-spacing:2px;
  }
  .hero-title .accent {
    color:#E11D48;
    position:relative;
  }
  .hero-title .accent::after {
    content:''; position:absolute; left:0; right:4px; bottom:8px;
    height:6px; background:#E11D48; opacity:0.15; border-radius:2px;
  }
  .hero-sub {
    font-family:'Noto Sans SC',sans-serif; font-size:24px; font-weight:400;
    color:#A8A29E; margin-top:14px; letter-spacing:6px;
  }

  /* ===== Decorative divider ===== */
  .divider {
    position:relative; z-index:1;
    margin:12px 56px 0;
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
  }
  .divider-line { flex:1; height:1px; background:#E7E5E4; }
  .divider-dot { width:5px; height:5px; border-radius:50%; background:#CA8A04; flex-shrink:0; }

  /* ===== Cover image ===== */
  {{#if coverPath}}
  .cover-wrap {
    position:relative; z-index:1;
    width:80%; margin:10px auto 0; flex-shrink:0;
    padding:8px;
    background:#FFFFFF;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(28,25,23,0.06), 0 1px 3px rgba(28,25,23,0.04);
  }
  .cover-wrap img {
    width:100%; height:auto; display:block;
    border-radius:8px;
  }
  {{/if}}

  /* ===== Content ===== */
  .content {
    position:relative; z-index:1;
    flex-shrink:0; padding:10px 56px 0;
  }

  .case {
    display:flex; align-items:flex-start; gap:16px;
    padding:11px 0;
    border-bottom:1px solid #ECEAE5;
    transition:all 0.2s;
  }
  .case:last-child { border-bottom:none; }
  .case:first-child { position:relative; }
  .case:first-child .case-rank::before {
    content:''; position:absolute; left:-8px; top:-2px; bottom:-2px;
    width:3px; background:linear-gradient(180deg,#CA8A04,#E5A812);
    border-radius:2px; opacity:0.5;
  }
  .case:hover {
    padding-left:10px; margin-left:-10px;
    padding-right:10px; margin-right:-10px;
    background:rgba(232,229,228,0.4); border-radius:8px;
    border-color:transparent;
  }
  .case:last-child:hover { border-bottom-color:transparent; }

  .case-rank {
    flex-shrink:0; width:56px; text-align:center;
    padding-top:2px;
  }
  .rank-num {
    font-family:'Noto Serif SC',serif; font-size:42px; font-weight:700; line-height:1;
  }
  .rank-num-1 { color:#CA8A04; }
  .rank-num-2 { color:#94A3B8; }
  .rank-num-3 { color:#C4956A; }

  .case-body { flex:1; min-width:0; }
  .case-top {
    display:flex; align-items:flex-start; gap:8px;
  }
  .case-title {
    font-family:'Noto Serif SC',serif; font-size:26px; font-weight:700;
    line-height:1.35; color:#1C1917; flex:1;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
  }
  .case-score {
    flex-shrink:0;
    display:inline-flex; align-items:center; gap:2px;
    padding:3px 11px 3px 8px;
    background:linear-gradient(135deg,#CA8A04,#E5A812);
    color:#FFF; border-radius:9999px;
    font-family:'Roboto Mono',monospace; font-size:16px; font-weight:700;
    box-shadow:0 1px 4px rgba(202,138,4,0.2);
    margin-top:3px;
  }
  .case-score::before { content:'★'; font-size:11px; opacity:0.95; }
  .case-summary {
    font-size:16px; color:#78716C; line-height:1.45; margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
  }
  .case-tags {
    display:flex; gap:5px; flex-wrap:wrap; margin-top:4px;
  }
  .tag {
    padding:2px 8px; border-radius:9999px;
    font-size:12px; font-weight:600; line-height:1.4;
  }
  .tag-0 { background:#FFE0E6; color:#D6336C; }
  .tag-1 { background:#D1FAE5; color:#059669; }
  .tag-2 { background:#E9D8FD; color:#7C3AED; }
  .tag-3 { background:#FEF3C7; color:#D97706; }
  .tag-4 { background:#DBEAFE; color:#2563EB; }

  /* ===== Footer ===== */
  .spacer {
    flex:1; position:relative; z-index:1;
  }
  .footer {
    position:relative; z-index:1;
    flex-shrink:0; padding:12px 56px 32px;
    text-align:center;
  }
  .footer-ornament {
    font-size:16px; color:#D6D3D1; margin-bottom:6px;
    letter-spacing:6px;
  }
  .footer-divider {
    width:40px; height:2px; background:#CA8A04; margin:0 auto 7px;
    border-radius:2px;
  }
  .footer-brand {
    font-family:'Noto Serif SC',serif; font-size:13px; font-weight:700;
    color:#A8A29E; letter-spacing:4px;
  }
  .footer-hint {
    font-size:11px; color:#D6D3D1; margin-top:2px;
    letter-spacing:2px;
  }
</style>
</head>
<body>
<div class="corner-accent"></div>

<div class="header">
  <div class="header-brand"><em>MindDock</em>超级个体知识库</div>
  <div class="header-date">{{date}}</div>
</div>

<div class="hero">
  <div class="hero-title">今日<span class="accent">搞钱</span>案例精选</div>
  <div class="hero-sub">把时间花在值得的事上</div>
</div>

<div class="divider">
  <span class="divider-line"></span>
  <span class="divider-dot"></span>
  <span class="divider-line"></span>
</div>

{{#if coverPath}}
<div class="cover-wrap">
  <img src="{{coverPath}}" alt="cover">
</div>
{{/if}}

<div class="content">
{{#each cases}}
<div class="case">
  <div class="case-rank">
    <span class="rank-num rank-num-{{rank}}">{{rankPad}}</span>
  </div>
  <div class="case-body">
    <div class="case-top">
      <div class="case-title">{{title}}</div>
      <span class="case-score">{{score_total}}</span>
    </div>
    <div class="case-summary">{{summary}}</div>
    <div class="case-tags">
      {{#each tags}}<span class="tag tag-{{tagIndex}}">{{text}}</span>{{/each}}
    </div>
  </div>
</div>
{{/each}}
</div>

<div class="spacer"></div>
<div class="footer">
  <div class="footer-ornament">✦ ✦ ✦</div>
  <div class="footer-divider"></div>
  <div class="footer-brand">MindDock超级个体知识库</div>
  <div class="footer-hint">← 查看更多精选案例</div>
</div>
</body>
</html>
