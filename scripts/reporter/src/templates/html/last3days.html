<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:'Noto Serif SC'; src:url('{{fontSerif}}') format('woff2'); font-weight:700; }
  @font-face { font-family:'Noto Sans SC'; src:url('{{fontSans}}') format('woff2'); font-weight:400; }
  @font-face { font-family:'Noto Sans SC'; src:url('{{fontSans}}') format('woff2'); font-weight:600; }
  @font-face { font-family:'Roboto Mono'; src:url('{{fontMono}}') format('woff2'); font-weight:700; }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; background:#F8F6F1; padding-bottom:60px;
    font-family:'Noto Sans SC',sans-serif; color:#1C1917;
    position:relative;
  }

  .header {
    padding:32px 48px 0;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .header-brand {
    font-family:'Noto Sans SC',sans-serif; font-size:18px; font-weight:600;
    color:#78716C; letter-spacing:2px;
  }
  .header-brand em {
    font-family:'Noto Serif SC',serif; font-style:normal; font-weight:700;
    color:#E11D48; font-size:20px;
  }
  .header-sub {
    font-family:'Noto Sans SC',sans-serif; font-size:14px; font-weight:500;
    color:#A8A29E; letter-spacing:1px;
  }

  .hero {
    padding:10px 48px 0;
  }
  .hero-title {
    font-family:'Noto Serif SC',serif; font-size:76px; font-weight:700;
    color:#1C1917; line-height:1.08; letter-spacing:2px;
  }
  .hero-sub {
    font-family:'Noto Sans SC',sans-serif; font-size:16px; font-weight:400;
    color:#A8A29E; margin-top:6px; letter-spacing:4px;
  }

  .divider {
    margin:10px 48px 0;
    display:flex; align-items:center; gap:10px;
  }
  .divider-line { flex:1; height:1px; background:#E7E5E4; }
  .divider-dot { width:5px; height:5px; border-radius:50%; background:#CA8A04; flex-shrink:0; }

  .content { padding:18px 48px 0; }

  .day-card {
    background:#FFFFFF; border-radius:14px; padding:16px 20px 8px;
    box-shadow:0 2px 10px rgba(28,25,23,0.04);
    margin-bottom:16px;
  }
  .day-card:last-child { margin-bottom:0; }

  .day-header {
    display:flex; align-items:center; gap:8px;
    padding-bottom:10px; border-bottom:1.5px solid #ECEAE5; margin-bottom:4px;
  }
  .day-header-dot { width:5px; height:5px; border-radius:50%; background:#E11D48; flex-shrink:0; }
  .day-label { font-size:16px; font-weight:600; color:#1C1917; letter-spacing:1px; }
  .day-count {
    margin-left:auto; font-size:12px; color:#A8A29E; font-weight:500;
  }

  .case-row {
    display:flex; align-items:flex-start; gap:10px; padding:12px 4px;
    border-bottom:1px solid #F0EDE8; transition:all 0.15s;
    border-radius:6px; flex-wrap:wrap;
  }
  .case-row:last-child { border-bottom:none; }
  .case-row:hover { background:#FAFAF8; }

  .case-rank {
    width:32px; height:32px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; flex-shrink:0;
    font-family:'Roboto Mono',monospace; font-size:15px; font-weight:700; color:#FFF;
  }
  .rank-gold { background:linear-gradient(135deg,#CA8A04,#E5A812); }
  .rank-silver { background:linear-gradient(135deg,#94A3B8,#64748B); }
  .rank-bronze { background:linear-gradient(135deg,#C4956A,#A67B5B); }

  .case-title {
    font-family:'Noto Serif SC',serif; font-size:24px; font-weight:700;
    line-height:1.35; color:#1C1917; flex:1; min-width:0;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
  }

  .case-score {
    font-family:'Roboto Mono',monospace; font-size:17px; font-weight:700;
    color:#CA8A04; white-space:nowrap; flex-shrink:0;
  }
  .case-score::before { content:'★'; font-size:12px; margin-right:1px; }

  .case-tags {
    display:flex; gap:4px; flex-wrap:wrap;
    width:100%; padding-left:42px; margin-top:-2px;
  }
  .tag {
    padding:2px 8px; border-radius:9999px;
    font-size:11px; font-weight:600; line-height:1.4;
  }
  .tag-0 { background:#FFE0E6; color:#D6336C; }
  .tag-1 { background:#D1FAE5; color:#059669; }
  .tag-2 { background:#E9D8FD; color:#7C3AED; }
  .tag-3 { background:#FEF3C7; color:#D97706; }
  .tag-4 { background:#DBEAFE; color:#2563EB; }

  .empty-state { text-align:center; padding:80px 0; }
  .empty-state p { font-size:20px; margin-bottom:10px; color:#78716C; }
  .empty-sub { font-size:15px; color:#A8A29E; letter-spacing:2px; }

  .footer {
    text-align:center; padding:28px 48px 0;
  }
  .footer-divider { width:32px; height:2px; background:#CA8A04; margin:0 auto 8px; border-radius:2px; }
  .footer-brand {
    font-family:'Noto Serif SC',serif; font-size:13px; font-weight:700;
    color:#A8A29E; letter-spacing:4px;
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-brand"><em>MindDock</em>超级个体知识库</div>
  <div class="header-sub">精选回顾</div>
</div>
<div class="hero">
  <div class="hero-title">三日精选案例</div>
  <div class="hero-sub">不错过每一份搞钱灵感</div>
</div>
<div class="divider">
  <span class="divider-line"></span>
  <span class="divider-dot"></span>
  <span class="divider-line"></span>
</div>
<div class="content">
{{#if hasDays}}
  {{#each days}}<div class="day-card">
  <div class="day-header">
    <span class="day-header-dot"></span>
    <div class="day-label">{{dayLabel}}</div>
    <span class="day-count">3 个案例</span>
  </div>
  {{#each cases}}<div class="case-row">
    <div class="case-rank {{rankClass}}">{{rank}}</div>
    <div class="case-title">{{title}}</div>
    <div class="case-score">{{score_total}}</div>
    <div class="case-tags">
      {{#each tags}}<span class="tag tag-{{tagIndex}}">{{text}}</span>{{/each}}
    </div>
  </div>{{/each}}
</div>{{/each}}
{{else}}
<div class="empty-state">
  <p>每日更新精选案例</p>
  <p class="empty-sub">更多副业实操，敬请关注 MindDock</p>
</div>
{{/if}}
</div>
<div class="footer">
  <div class="footer-divider"></div>
  <div class="footer-brand">MindDock超级个体知识库</div>
</div>
</body>
</html>
